name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Keep staging and production on the same release, including during approvals.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      revision: ${{ github.event.workflow_run.head_sha }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Reject superseded main builds
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('current', data.commit.sha === context.payload.workflow_run.head_sha);
      - name: Download the image tested by CI
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish the tested image, without rebuilding
        if: steps.current.outputs.current == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(cat "$RUNNER_TEMP/release-image/image.id")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker load --input "$RUNNER_TEMP/release-image/image.tar"
          [[ "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$REVISION" ]]
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$REVISION"
          docker tag "$image_id" "$tag"
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$tag"
          image="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$image" == "ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '### Published image\n`%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: publish
    if: needs.publish.outputs.current == 'true' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit

  production:
    needs: [publish, staging]
    if: needs.staging.result == 'success' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit
