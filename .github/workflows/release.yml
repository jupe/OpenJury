name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      # workflow_run checks out trusted default-branch code, never source artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source run identity and reject superseded main builds
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { getTrustedPublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/trusted-publication.mjs`);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const { run, artifact } = await getTrustedPublication({
              github, repository, runId: context.payload.workflow_run.id,
            });
            if (run.run_attempt !== context.payload.workflow_run.run_attempt) {
              throw new Error('Source run was rerun after this event');
            }
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            core.setOutput('current', branch.commit.sha === run.head_sha);
            core.setOutput('artifact', artifact.id);
            core.setOutput('revision', run.head_sha);
            core.setOutput('attempt', run.run_attempt);
      - name: Download only the validated publication record
        if: steps.source.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/published
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate publication record
        if: steps.source.outputs.current == 'true'
        id: image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { validatePublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/trusted-publication.mjs`);
            const publication = validatePublication(JSON.parse(await readFile(
              `${process.env.RUNNER_TEMP}/published/image.json`, 'utf8'
            )), {
              head_sha: process.env.REVISION, id: context.payload.workflow_run.id,
              run_attempt: process.env.SOURCE_ATTEMPT,
            }, `${context.repo.owner}/${context.repo.repo}`);
            core.setOutput('image', publication.image);
            core.setOutput('id', publication.imageId);
      - name: Promote the tested digest, never a mutable CI tag
        if: steps.source.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
          REVISION: ${{ steps.source.outputs.revision }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" == "$IMAGE_ID" ]]
          [[ "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$REVISION" ]]
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$REVISION"
          docker tag "$IMAGE" "$tag"
          docker push "$tag"
          printf '### Promoted tested image\n%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
