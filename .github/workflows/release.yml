name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Keep staging and production on the same release, including during approvals.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.publish.outputs.image }}
      revision: ${{ github.event.workflow_run.head_sha }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Reject superseded main builds
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('current', data.commit.sha === context.payload.workflow_run.head_sha);
      - name: Check out trusted release automation
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the checked image from CI job metadata
        if: steps.current.outputs.current == 'true'
        id: tested-image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { releaseImage } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-image.mjs`);
            core.setOutput('image', await releaseImage({ github, context }));
      - name: Publish the tested image, without rebuilding
        if: steps.current.outputs.current == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          TESTED_IMAGE: ${{ steps.tested-image.outputs.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TESTED_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "${TESTED_IMAGE%@*}" == "ghcr.io/${GITHUB_REPOSITORY,,}" ]]
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$TESTED_IMAGE"
          image="$(docker image inspect "$TESTED_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^ghcr.io/${GITHUB_REPOSITORY,,}@sha256:")"
          [[ "$image" == "$TESTED_IMAGE" ]]
          [[ "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$REVISION" ]]
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$REVISION"
          docker tag "$image" "$tag"
          docker push "$tag"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '### Published image\n`%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: publish
    if: needs.publish.outputs.current == 'true' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit

  production:
    needs: [publish, staging]
    if: needs.staging.result == 'success' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit

  notify:
    needs: [publish, production]
    if: >-
      needs.production.result == 'success' &&
      vars.DEPLOYMENT_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.revision }}
          persist-credentials: false
      - name: Notify feedback reporters after production smoke tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_REVISION: ${{ needs.publish.outputs.revision }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        with:
          script: |
            const { notifyDeployment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-feedback.mjs`);
            await notifyDeployment({
              github, context, core,
              revision: process.env.DEPLOYED_REVISION,
              productionResult: process.env.PRODUCTION_RESULT
            });
