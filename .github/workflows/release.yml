name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Keep staging and production on the same release, including during approvals.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      revision: ${{ github.event.workflow_run.head_sha }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Reject superseded main builds
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('current', data.commit.sha === context.payload.workflow_run.head_sha);
      - name: Install Cosign
        if: steps.current.outputs.current == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Publish the tested image, without rebuilding
        if: steps.current.outputs.current == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        shell: bash
        run: |
          set -euo pipefail
          : "${COSIGN_PUBLIC_KEY:?Configure the repository COSIGN_PUBLIC_KEY variable}"
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          source="ghcr.io/${GITHUB_REPOSITORY,,}:ci-$CI_RUN_ID"
          docker pull "$source"
          image="$(docker image inspect "$source" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^ghcr.io/${GITHUB_REPOSITORY,,}@sha256:")"
          [[ "$image" == "ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"* && "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          cosign verify --key env://COSIGN_PUBLIC_KEY --insecure-ignore-tlog=true \
            -a "repository=$GITHUB_REPOSITORY" \
            -a "workflow=$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            -a "ref=refs/heads/main" -a "revision=$REVISION" -a "run-id=$CI_RUN_ID" "$image"
          [[ "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$REVISION" ]]
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$REVISION"
          docker tag "$image" "$tag"
          docker push "$tag"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '### Published image\n`%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: publish
    if: needs.publish.outputs.current == 'true' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit

  production:
    needs: [publish, staging]
    if: needs.staging.result == 'success' && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
    secrets: inherit

  notify:
    needs: [publish, production]
    if: >-
      needs.production.result == 'success' &&
      vars.DEPLOYMENT_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.revision }}
          persist-credentials: false
      - name: Notify feedback reporters after production smoke tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_REVISION: ${{ needs.publish.outputs.revision }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        with:
          script: |
            const { notifyDeployment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-feedback.mjs`);
            await notifyDeployment({
              github, context, core,
              revision: process.env.DEPLOYED_REVISION,
              productionResult: process.env.PRODUCTION_RESULT
            });
