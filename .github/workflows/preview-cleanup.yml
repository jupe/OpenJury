name: PR preview cleanup

on:
  # Privileged cleanup never downloads artifacts or executes PR-controlled code.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR preview to destroy (also works while preview CD is disabled)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: >-
      (vars.PREVIEW_CD_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, openjury-dev]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    # No environment approval: closing a PR must not leave its resources running.
    concurrency:
      group: openjury-preview-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Clean up unless the PR has since reopened
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          COMPOSE_PROJECT_NAME: openjury-pr-${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Invalid PR number');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (context.eventName === 'workflow_dispatch' || pr.state === 'closed') {
              await exec.exec('bash', ['deploy/stack.sh', 'destroy']);
              for (const environment of ['dev', `dev-pr-${process.env.PR_NUMBER}`]) {
                const deployments = await github.paginate(github.rest.repos.listDeployments, {
                  ...context.repo, environment, per_page: 100,
                });
                for (const deployment of deployments) {
                  if (deployment.description !== `PR #${process.env.PR_NUMBER} preview`) continue;
                  await github.rest.repos.createDeploymentStatus({
                    ...context.repo, deployment_id: deployment.id, state: 'inactive',
                  });
                }
              }
            }

  registry:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      packages: write
    concurrency:
      group: ghcr-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prune expired images belonging only to closed PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { cleanupRegistry } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/registry-cleanup.mjs`);
            await cleanupRegistry({
              github, context, core, dryRun: false, previewOnly: true,
            });
