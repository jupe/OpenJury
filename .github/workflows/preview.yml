name: PR preview

on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: number
      sha:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      vars.PREVIEW_CD_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, openjury-dev]
    timeout-minutes: 20
    # Approval is required before any PR image is loaded.
    environment:
      name: dev
      # Register the PR head below, not Actions' synthetic merge commit.
      deployment: false
    concurrency:
      group: openjury-preview-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: read
      deployments: write
    env:
      COMPOSE_PROJECT_NAME: openjury-pr-${{ inputs.pr }}
      APP_HOST: pr-${{ inputs.pr }}.${{ vars.DEV_BASE_DOMAIN }}
      # `http` only for a LAN-only dev VM without TLS (see docs/proxmox.md).
      APP_SCHEME: ${{ vars.APP_SCHEME || 'https' }}
      PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
      TLS_RESOLVER: ${{ vars.TLS_RESOLVER }}
      PULL_POLICY: never
      # Previews must never inherit credentials for a persistent backend; stack.sh
      # creates a disposable per-PR Supabase when the PR ships migrations.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      PREVIEW_ADMIN_EMAIL: ${{ vars.PREVIEW_ADMIN_EMAIL }}
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Recheck PR after waiting for approval and the deployment lock
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_SHA: ${{ inputs.sha }}
          ARTIFACT: ${{ inputs.artifact }}
        with:
          script: |
            if (Number(process.env.PR_NUMBER) !== context.payload.pull_request.number ||
                process.env.EXPECTED_SHA !== context.payload.pull_request.head.sha ||
                ![`image-ref-${context.runId}`, `image-${context.runId}`].includes(process.env.ARTIFACT)) {
              throw new Error('Preview inputs do not match this PR workflow run');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            const current = pr.state === 'open' && pr.head.sha === process.env.EXPECTED_SHA;
            core.setOutput('current', current);
      - name: Register deployment for the PR head commit
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.EXPECTED_SHA,
              environment: `dev-pr-${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `PR #${context.payload.pull_request.number} preview`,
            });
            core.setOutput('id', deployment.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Destroy old preview and all its data
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            await exec.exec('bash', ['deploy/stack.sh', 'destroy']);
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: `dev-pr-${process.env.PR_NUMBER}`, per_page: 100,
            });
            for (const deployment of deployments) {
              if (deployment.id === Number(process.env.DEPLOYMENT_ID)) continue;
              await github.rest.repos.createDeploymentStatus({
                ...context.repo, deployment_id: deployment.id, state: 'inactive',
              });
            }
      - name: Download tested PR image or its reference, never PR scripts
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/preview-image
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Start clean preview
        id: deploy
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/preview-image/image.ref" ]]; then
            image="$(cat "$RUNNER_TEMP/preview-image/image.ref")"
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
            [[ "$image" == "ghcr.io/${GITHUB_REPOSITORY,,}-preview@"* ]]
            trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker pull --quiet "$image"
            export IMAGE="$image"
          else
            image_id="$(cat "$RUNNER_TEMP/preview-image/image.id")"
            [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker load --input "$RUNNER_TEMP/preview-image/image.tar"
            export IMAGE="$image_id"
          fi
          if [[ -d "$RUNNER_TEMP/preview-image/migrations" ]]; then
            export SUPABASE_MIGRATIONS="$RUNNER_TEMP/preview-image/migrations"
          fi
          bash deploy/stack.sh deploy
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 --max-time 10 "$APP_SCHEME://$APP_HOST/api/health"
          echo "url=$APP_SCHEME://$APP_HOST" >> "$GITHUB_OUTPUT"
          printf '### PR preview\n%s://%s\n\nRecreated from scratch; no data is preserved.\n' "$APP_SCHEME" "$APP_HOST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove failed, closed, or superseded deployments
        if: always() && steps.current.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_SHA: ${{ inputs.sha }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            const current = pr.state === 'open' && pr.head.sha === process.env.EXPECTED_SHA;
            const success = process.env.DEPLOY_OUTCOME === 'success' && process.env.JOB_STATUS === 'success';
            if (!success || !current) {
              await exec.exec('bash', ['deploy/stack.sh', 'destroy']);
            }
            if (process.env.DEPLOYMENT_ID) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
                state: !current ? 'inactive' : success ? 'success' : 'failure',
                environment_url: success && current ? process.env.DEPLOYMENT_URL : undefined,
                log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                auto_inactive: true,
              });
            }
      - name: Remove downloaded image archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/preview-image"
