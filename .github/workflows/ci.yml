name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether CI is needed
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const { shouldRunChecks } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-changes.mjs`);
            const build = shouldRunChecks({
              eventName: context.eventName,
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
            });
            core.setOutput('build', build);
            if (!build) core.info('Only documentation changed; skipping build and tests.');

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare prebuilt CI images
        id: ci-images
        uses: ./.github/actions/ci-images
        with:
          dependencies: 'true'

      - name: Lint
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
        run: docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" npm run lint

      - name: Type check
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
        run: docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" npm run typecheck

      - name: Validate deployment configuration
        run: |
          bash -n deploy/stack.sh
          docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" shellcheck deploy/stack.sh
          docker compose -f deploy/compose.yml -f deploy/compose.tls.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.tls.yml \
            -f deploy/compose.supabase.yml -f deploy/compose.supabase.tls.yml config --quiet
          bash -n deploy/proxmox/vm.sh deploy/proxmox/vm-bootstrap.sh deploy/supabase/migrate.sh supabase/test.sh
          docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" \
            shellcheck deploy/proxmox/vm.sh deploy/proxmox/vm-bootstrap.sh deploy/supabase/migrate.sh supabase/test.sh
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
          COMPOSE_PROJECT_NAME: openjury-pr-1
          IMAGE: openjury:ci
          APP_HOST: ci.example.invalid
          PULL_POLICY: never

      - name: Validate Proxmox playbooks without accessing infrastructure
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
        run: |
          docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" ansible-playbook \
            -i deploy/proxmox/inventory.example.yml deploy/proxmox/provision.yml --syntax-check
          docker run --rm --volume "$PWD:/workspace" "$CI_TOOLS" ansible-playbook \
            -i deploy/proxmox/inventory.example.yml deploy/proxmox/guests.yml --syntax-check

      - name: Test real database, authentication, storage, and realtime
        timeout-minutes: 15
        run: bash supabase/test.sh

      - name: Build production image
        env:
          DEPENDENCIES_IMAGE: ${{ steps.ci-images.outputs.dependencies }}
        run: |
          docker build --build-arg "DEPENDENCIES_IMAGE=$DEPENDENCIES_IMAGE" \
            --tag openjury:ci --label "org.opencontainers.image.revision=${{ github.sha }}" .

      - name: Start production image
        run: |
          docker run --detach --name openjury-ci \
            --publish 127.0.0.1:3000:3000 \
            --user 1001:1001 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1001,gid=1001 \
            openjury:ci

      - name: Wait for health check
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production container did not become healthy"
          exit 1

      - name: Test production image
        run: |
          docker run --rm --init --network host --ipc host \
            --volume "$PWD:/workspace" --env PLAYWRIGHT_BASE_URL \
            "$CI_TOOLS" npm run test:e2e
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          docker save --output "$RUNNER_TEMP/image/image.tar" openjury:ci
          docker image inspect openjury:ci --format '{{.Id}}' > "$RUNNER_TEMP/image/image.id"
          docker image inspect openjury:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' > "$RUNNER_TEMP/image/revision"
          test "$(cat "$RUNNER_TEMP/image/revision")" = "$GITHUB_SHA"

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image/image.tar
            ${{ runner.temp }}/image/image.id
            ${{ runner.temp }}/image/revision
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_id }}
          overwrite: true
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker logs openjury-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force openjury-ci || true

  checks:
    name: checks
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
          fi

  publish:
    name: Publish tested main image
    needs: [build, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download this run's tested archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image
      - name: Validate and publish without executing source or rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(cat "$RUNNER_TEMP/image/image.id")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(cat "$RUNNER_TEMP/image/revision")" == "$GITHUB_SHA" ]]
          docker load --input "$RUNNER_TEMP/image/image.tar"
          [[ "$(docker image inspect openjury:ci --format '{{.Id}}')" == "$image_id" ]]
          [[ "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$image_id" "$tag"
          docker push "$tag"
          image="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^ghcr.io/${GITHUB_REPOSITORY,,}@sha256:")"
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          export PUBLISHED_IMAGE="$image" TESTED_IMAGE_ID="$image_id"
          mkdir -p "$RUNNER_TEMP/published"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/published/image.json", JSON.stringify({
            image: process.env.PUBLISHED_IMAGE, imageId: process.env.TESTED_IMAGE_ID,
            revision: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT
          }))'
          printf '### Tested main image\n%s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable publication for Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published/image.json
          if-no-files-found: error
          retention-days: 30
