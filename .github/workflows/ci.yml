name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether CI is needed
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const { shouldRunChecks } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-changes.mjs`);
            const build = shouldRunChecks({
              eventName: context.eventName,
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
            });
            core.setOutput('build', build);
            if (!build) core.info('Only documentation changed; skipping build and tests.');

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate deployment configuration
        run: |
          bash -n deploy/stack.sh
          shellcheck deploy/stack.sh
          docker compose -f deploy/compose.yml -f deploy/compose.tls.yml config --quiet
          bash -n deploy/proxmox/dev-vm.sh deploy/proxmox/dev-bootstrap.sh
          shellcheck deploy/proxmox/dev-vm.sh deploy/proxmox/dev-bootstrap.sh
        env:
          COMPOSE_PROJECT_NAME: openjury-pr-1
          IMAGE: openjury:ci
          APP_HOST: ci.example.invalid
          PULL_POLICY: never

      - name: Validate Proxmox playbooks without accessing infrastructure
        run: |
          pipx run --spec "$(cat deploy/proxmox/requirements.txt)" ansible-playbook \
            -i deploy/proxmox/inventory.example.yml deploy/proxmox/provision.yml --syntax-check
          pipx run --spec "$(cat deploy/proxmox/requirements.txt)" ansible-playbook \
            -i deploy/proxmox/inventory.example.yml deploy/proxmox/guests.yml --syntax-check

      - name: Build production image
        run: docker build --tag openjury:ci --label "org.opencontainers.image.revision=${{ github.sha }}" .

      - name: Start production image
        run: |
          docker run --detach --name openjury-ci \
            --publish 127.0.0.1:3000:3000 \
            --user 1001:1001 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1001,gid=1001 \
            openjury:ci

      - name: Wait for health check
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production container did not become healthy"
          exit 1

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Test production image
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Save tested image
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save --output "$RUNNER_TEMP/image/image.tar" openjury:ci
          docker image inspect openjury:ci --format '{{.Id}}' > "$RUNNER_TEMP/image/image.id"

      - name: Upload tested image
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/image/image.tar
            ${{ runner.temp }}/image/image.id
          archive: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          overwrite: true
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker logs openjury-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force openjury-ci || true

  checks:
    name: checks
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
          fi
