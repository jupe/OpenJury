# Reference only: install in a separate PRIVATE repository's .github/workflows.
# Configure SOURCE_REPOSITORY, SOURCE_TOKEN (source Actions/contents read),
# GHCR_TOKEN (source package read), protected staging/production environments,
# and runner groups restricted exclusively to the private deployment repository.
# Set GHCR_USERNAME to the registry token owner's login when different from actor.
# Bootstrap runners against that private repo only; SOURCE_REPOSITORY must have
# no attached self-hosted runners. dev requires an explicit PREVIEW_ADMIN_PASSWORD.
# Provision with DEPLOYMENT_REPOSITORY and matching TRUSTED_PRIVATE_DEPLOYMENT_REPO.
name: Deploy validated source environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_run:
        type: number
        default: 0
      source_attempt:
        type: number
        default: 0
      pr_number:
        type: number
        default: 0
    outputs:
      source-run:
        value: ${{ jobs.source.outputs.run-id }}
      source-attempt:
        value: ${{ jobs.source.outputs.attempt }}

permissions:
  contents: read

jobs:
  source:
    if: >-
      github.event.repository.private == true && github.ref == 'refs/heads/main' &&
      (inputs.environment == 'staging' || inputs.environment == 'production' || inputs.environment == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.publication.outputs.image }}
      image-id: ${{ steps.publication.outputs.image-id }}
      revision: ${{ steps.run.outputs.revision }}
      run-id: ${{ steps.run.outputs.run-id }}
      attempt: ${{ steps.run.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Select only successful trusted source main publication
        id: run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          TARGET: ${{ inputs.environment }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ secrets.SOURCE_TOKEN }}
          script: |
            const { getTrustedPublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/trusted-publication.mjs`);
            const repository = process.env.SOURCE_REPOSITORY;
            const [owner, repo] = repository.split('/');
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            let runId = Number(process.env.SOURCE_RUN);
            if (runId === 0) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', branch: 'main',
                event: 'push', status: 'success', per_page: 20,
              });
              const candidate = data.workflow_runs.find(run => run.head_sha === branch.commit.sha);
              if (!candidate) throw new Error('Current source main has no successful CI publication');
              runId = candidate.id;
            }
            const { run, artifact } = await getTrustedPublication({ github, repository, runId });
            if (run.head_sha !== branch.commit.sha) throw new Error('Source main has advanced');
            if (Number(process.env.SOURCE_ATTEMPT) !== 0 &&
                Number(process.env.SOURCE_ATTEMPT) !== run.run_attempt) {
              throw new Error('Source run was rerun after staging');
            }
            if (process.env.TARGET === 'dev') {
              if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Invalid PR number');
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: Number(process.env.PR_NUMBER),
              });
              if (pr.state !== 'open' || pr.head?.repo?.full_name !== repository) {
                throw new Error('Preview requires an open same-repository PR, never a fork');
              }
            }
            core.setOutput('run-id', run.id);
            core.setOutput('revision', run.head_sha);
            core.setOutput('attempt', run.run_attempt);
            core.setOutput('artifact', artifact.id);
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.run.outputs.artifact }}
          path: ${{ runner.temp }}/published
          merge-multiple: true
          github-token: ${{ secrets.SOURCE_TOKEN }}
          repository: ${{ vars.SOURCE_REPOSITORY }}
          run-id: ${{ steps.run.outputs.run-id }}
      - name: Validate immutable source publication
        id: publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_RUN: ${{ steps.run.outputs.run-id }}
          SOURCE_ATTEMPT: ${{ steps.run.outputs.attempt }}
          SOURCE_REVISION: ${{ steps.run.outputs.revision }}
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { validatePublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/trusted-publication.mjs`);
            const publication = validatePublication(JSON.parse(await readFile(
              `${process.env.RUNNER_TEMP}/published/image.json`, 'utf8'
            )), {
              id: process.env.SOURCE_RUN, run_attempt: process.env.SOURCE_ATTEMPT,
              head_sha: process.env.SOURCE_REVISION,
            }, process.env.SOURCE_REPOSITORY);
            core.setOutput('image', publication.image);
            core.setOutput('image-id', publication.imageId);

  deploy:
    needs: source
    runs-on: [self-hosted, linux, x64, "openjury-${{ inputs.environment }}"]
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ needs.source.outputs.revision }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Reject stale or invalid releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVISION: ${{ needs.source.outputs.revision }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_RUN: ${{ needs.source.outputs.run-id }}
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
          TARGET: ${{ inputs.environment }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ secrets.SOURCE_TOKEN }}
          script: |
            const { getTrustedPublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/trusted-publication.mjs`);
            const { run } = await getTrustedPublication({
              github, repository: process.env.SOURCE_REPOSITORY, runId: process.env.SOURCE_RUN,
            });
            if (run.head_sha !== process.env.REVISION ||
                String(run.run_attempt) !== process.env.SOURCE_ATTEMPT) {
              throw new Error('Source revision or run attempt changed');
            }
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const { data } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            if (data.commit.sha !== process.env.REVISION) {
              throw new Error('Main has advanced; deploy its successful CI run instead');
            }
            if (process.env.TARGET === 'dev') {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: Number(process.env.PR_NUMBER),
              });
              if (pr.state !== 'open' ||
                  pr.head?.repo?.full_name !== process.env.SOURCE_REPOSITORY) {
                throw new Error('Preview PR closed or is not same-repository after approval');
              }
            }
      - name: Deploy immutable image
        id: deploy
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          IMAGE_ID: ${{ needs.source.outputs.image-id }}
          REVISION: ${{ needs.source.outputs.revision }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          COMPOSE_PROJECT_NAME: ${{ inputs.environment == 'dev' && format('openjury-pr-{0}', inputs.pr_number) || format('openjury-{0}', inputs.environment) }}
          APP_HOST: ${{ inputs.environment == 'dev' && format('pr-{0}.{1}', inputs.pr_number, vars.DEV_BASE_DOMAIN) || vars.APP_HOST }}
          APP_SCHEME: ${{ inputs.environment == 'dev' && (vars.APP_SCHEME || 'https') || 'https' }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
          TLS_RESOLVER: ${{ vars.TLS_RESOLVER }}
          # `upstream` when a proxy in front of the host terminates HTTPS.
          TLS_TERMINATION: ${{ vars.TLS_TERMINATION }}
          SUPABASE_URL: ${{ inputs.environment != 'dev' && vars.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ inputs.environment != 'dev' && secrets.SUPABASE_ANON_KEY || '' }}
          # Self-hosted Supabase on the host, migrated from this trusted revision.
          SUPABASE_MIGRATIONS: ${{ (inputs.environment == 'dev' || vars.SUPABASE_SELF_HOSTED == 'true') && format('{0}/supabase/migrations', github.workspace) || '' }}
          PREVIEW_ADMIN_EMAIL: ${{ vars.PREVIEW_ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ inputs.environment == 'dev' && secrets.PREVIEW_ADMIN_PASSWORD || '' }}
          # Comma-separated emails of users who may administer every group.
          PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ inputs.environment != 'dev' && secrets.SMTP_PASS || '' }}
          SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME }}
          AUTH_RATE_LIMIT_EMAIL_SENT: ${{ vars.AUTH_RATE_LIMIT_EMAIL_SENT || '10' }}
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
          TARGET: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$IMAGE" == "ghcr.io/${SOURCE_REPOSITORY,,}@"* ]]
          [[ "$APP_SCHEME" == https || ( "$TARGET" == dev && "$APP_SCHEME" == http ) ]]
          if [[ "$TARGET" == dev ]]; then
            : "${PREVIEW_ADMIN_PASSWORD:?Configure an explicit dev PREVIEW_ADMIN_PASSWORD secret}"
          fi
          trap 'docker logout ghcr.io; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          # The promotion tag confirms retention protection, never image authority.
          promotion="ghcr.io/${SOURCE_REPOSITORY,,}:sha-$REVISION"
          promoted_digest="$(docker manifest inspect --verbose "$promotion" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["Descriptor"]["digest"])')"
          [[ "$promoted_digest" == "${IMAGE#*@}" ]]
          docker pull "$IMAGE"
          [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" == "$IMAGE_ID" ]]
          [[ "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$REVISION" ]]
          if [[ "$TARGET" == dev ]]; then bash deploy/stack.sh destroy; fi
          bash deploy/stack.sh deploy
          echo "url=$APP_SCHEME://$APP_HOST" >> "$GITHUB_OUTPUT"
          printf '### Deployment\nImage: %s\nURL: %s://%s\n' "$IMAGE" "$APP_SCHEME" "$APP_HOST" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove an unsuccessful preview deployment
        if: failure() && inputs.environment == 'dev' && steps.deploy.outcome == 'failure'
        env:
          COMPOSE_PROJECT_NAME: openjury-pr-${{ inputs.pr_number }}
        run: bash deploy/stack.sh destroy

  smoke:
    needs: [source, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ needs.source.outputs.revision }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      # Hosted ingress tests avoid intentionally blocked guest hairpin egress.
      # Restricted private ingress requires operator-approved VPN access on this
      # runner; never weaken guest firewalls or add proxy/NAT bypasses for smoke.
      # The reusable workflow succeeds only after smoke, so staging gates production.
      - name: Prepare prebuilt CI tools
        id: ci-images
        uses: ./.github/actions/ci-images
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
      - name: Smoke test through the public ingress
        run: |
          docker run --rm --init --network host --ipc host \
            --volume "$PWD:/workspace" --env PLAYWRIGHT_BASE_URL \
            "$CI_TOOLS" npm run test:smoke
        env:
          CI_TOOLS: ${{ steps.ci-images.outputs.tools }}
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
      - name: Upload smoke report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
  cleanup:
    needs: [source, deploy, smoke]
    if: >-
      always() && inputs.environment == 'dev' &&
      needs.source.result == 'success' && needs.deploy.result == 'success' &&
      needs.smoke.result != 'success'
    runs-on: [self-hosted, linux, x64, openjury-dev]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No new approval is needed to remove this already-approved failed preview.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ needs.source.outputs.revision }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Remove a failed or cancelled smoke preview
        env:
          COMPOSE_PROJECT_NAME: openjury-pr-${{ inputs.pr_number }}
        run: bash deploy/stack.sh destroy
