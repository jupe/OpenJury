# Self-hosted Supabase backend. stack.sh adds this file when SUPABASE_MIGRATIONS
# is set: PR previews get fresh secrets per deployment and `stack.sh destroy`
# deletes their volumes; staging and production keep secrets on the host and
# their volumes are never deleted by these scripts.
# The API is served on the app's own host under the paths supabase-js expects.
x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks: [default, proxy]

x-db-env: &db-env
  PGHOST: db
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:-}
  PGDATABASE: postgres

services:
  web:
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PASSWORD_SIGN_IN: ${PASSWORD_SIGN_IN:-false}

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=60
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    volumes:
      - ./supabase/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    <<: *service
    image: supabase/gotrue:v2.196.0
    mem_limit: 96m
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL:-}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      GOTRUE_SITE_URL: ${SUPABASE_URL:-}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_URL:-}/dashboard
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-}
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL:-}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # GoTrue fetches templates over HTTP from the configured Site URL.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: /auth-email.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: /auth-email.html
      GOTRUE_MAILER_TEMPLATES_INVITE: /auth-email.html
      # Without SMTP settings, magic links go to the VM's Mailpit (vm-bootstrap.sh).
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-openjury-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-preview@openjury.invalid}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-OpenJury}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-openjury-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-auth.rule=Host(`${APP_HOST:-unused.invalid}`) && PathPrefix(`/auth/v1/`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-auth.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-auth.middlewares=${COMPOSE_PROJECT_NAME}-auth
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-auth.service=${COMPOSE_PROJECT_NAME}-auth
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.stripprefix.prefixes=/auth/v1
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-auth.loadbalancer.server.port=9999

  rest:
    <<: *service
    image: postgrest/postgrest:v14.17
    mem_limit: 96m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-openjury-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-rest.rule=Host(`${APP_HOST:-unused.invalid}`) && PathPrefix(`/rest/v1/`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-rest.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-rest.middlewares=${COMPOSE_PROJECT_NAME}-rest
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-rest.service=${COMPOSE_PROJECT_NAME}-rest
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-rest.stripprefix.prefixes=/rest/v1
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-rest.loadbalancer.server.port=3000

  realtime:
    <<: *service
    image: supabase/realtime:v2.134.10
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET:-}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-}
      METRICS_JWT_SECRET: ${JWT_SECRET:-}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      HEALTHCHECK_JWT: ${SUPABASE_ANON_KEY:-}
    healthcheck:
      test: [CMD-SHELL, 'curl -sSf -o /dev/null -H "Authorization: Bearer $$HEALTHCHECK_JWT" http://localhost:4000/api/tenants/realtime-dev/health']
      interval: 5s
      timeout: 5s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-openjury-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-realtime.rule=Host(`${APP_HOST:-unused.invalid}`) && PathPrefix(`/realtime/v1/`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-realtime.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-realtime.middlewares=${COMPOSE_PROJECT_NAME}-realtime-strip,${COMPOSE_PROJECT_NAME}-realtime-socket,${COMPOSE_PROJECT_NAME}-realtime-tenant
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-realtime.service=${COMPOSE_PROJECT_NAME}-realtime
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-realtime-strip.stripprefix.prefixes=/realtime/v1
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-realtime-socket.addprefix.prefix=/socket
      # Realtime takes its tenant from the Host subdomain; the seeded tenant is realtime-dev.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-realtime-tenant.headers.customrequestheaders.Host=realtime-dev.supabase-realtime
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-realtime.loadbalancer.server.port=4000

  storage:
    <<: *service
    image: supabase/storage-api:v1.74.0
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL:-}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://storage:5000/status]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-openjury-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.rule=Host(`${APP_HOST:-unused.invalid}`) && PathPrefix(`/storage/v1/`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.middlewares=${COMPOSE_PROJECT_NAME}-storage
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.service=${COMPOSE_PROJECT_NAME}-storage
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-storage.stripprefix.prefixes=/storage/v1
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-storage.loadbalancer.server.port=5000

  # One-shot: `docker compose run --rm migrate` after the services are healthy.
  migrate:
    image: supabase/postgres:17.6.1.136
    profiles: [migrate]
    entrypoint: [bash, /migrate.sh]
    environment:
      <<: *db-env
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
    volumes:
      - ./supabase/migrate.sh:/migrate.sh:ro
      - ${SUPABASE_MIGRATIONS:-./supabase/no-migrations}:/migrations:ro

volumes:
  db-data:
  db-config:
  storage-data:
